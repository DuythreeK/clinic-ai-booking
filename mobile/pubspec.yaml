name: clinic_ai_booking
description: "Clinic AI Booking mobile application"

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.3.1
  dio_smart_retry: ^6.0.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  
  # Navigation
  go_router: ^12.0.0
  
  # UI
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  
  # Model & JSON
  json_serializable: ^6.7.0
  json_annotation: ^4.8.1
  
  # Utilities
  get_it: ^7.6.0
  logger: ^2.0.2
  
  # Firebase (for FCM)
  # firebase_core: ^2.24.0
  # firebase_messaging: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.0
  
  # Code generation
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true

  # Assets placeholder
  assets:
    - assets/images/
    - assets/icons/
