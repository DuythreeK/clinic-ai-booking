services:
  mysql:
    image: mysql:8.0
    container_name: clinic_ai_mysql
    environment:
      MYSQL_DATABASE: clinic_ai
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
